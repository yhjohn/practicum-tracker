services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: practicum_app
    restart: unless-stopped
    ports:
      - "8087:8080"
    environment:
      DB_HOST: "mysql"
    volumes:
      - /volume1/docker/practicum-tracker:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel_network

  mysql:
    image: mysql:8.0
    container_name: practicum_mysql
    restart: unless-stopped
    environment:
      # Set your database values directly here or via Portainer Environment UI
      MYSQL_DATABASE: "laravel_db"
      MYSQL_USER: "laravel_user"
      MYSQL_PASSWORD: "secret_password"
      MYSQL_ROOT_PASSWORD: "secret_password"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel_network
    healthcheck:
      # Updated health check command with password check and startup grace period
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  laravel_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
