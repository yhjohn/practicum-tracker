services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: practicum_app
    restart: unless-stopped
    ports:
      - "8087:8080"
    environment:
      DB_HOST: "mysql"
    volumes:
      - /volume1/docker/practicum-tracker:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - practicum_network

  claude:
    build:
      context: .
      dockerfile: Dockerfile
      target: claude
    container_name: practicum_claude
    restart: unless-stopped
    # Only this container works the "summaries" queue, so `claude -p` never runs in the app container.
    command: ["php", "/var/www/html/artisan", "queue:work", "--queue=summaries", "--timeout=85"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s
    environment:
      DB_HOST: "mysql"
      PHP_FPM_POOL_NAME: "practicum_queue"
      # Long-lived subscription token from `claude setup-token`. Set it in Portainer, never in the repo.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # Summaries are simple; haiku is fastest and lightest on subscription quota.
      ANTHROPIC_MODEL: "haiku"
    volumes:
      - /volume1/docker/practicum-tracker:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - practicum_network

  mysql:
    image: mysql:8.0
    container_name: practicum_mysql
    restart: unless-stopped
    environment:
      # Set your database values directly here or via Portainer Environment UI
      MYSQL_DATABASE: "laravel_db"
      MYSQL_USER: "laravel_user"
      MYSQL_PASSWORD: "secret_password"
      MYSQL_ROOT_PASSWORD: "secret_password"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - practicum_network
    healthcheck:
      # Updated health check command with password check and startup grace period
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: practicum_gotenberg
    restart: unless-stopped
    networks:
      - practicum_network

networks:
  practicum_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
